# Alice project evidence state machine.
#
# This is the project's definition of legal evidence-state transitions. The DSH
# generic layer (dsh-agent-bus) only STORES and DISPLAYS evidence_state; it does
# NOT adjudicate legality here — check_evidence_state reads this file and
# REPORTS whether a requested from->to transition is allowed, and it never
# writes the state or replaces the supervisor/user decision.
#
# Rule syntax:
#   - from: <state>
#     to: <state>
#
# Hard rule enforced independently of this file (see check_evidence_state): for
# a task with client_visible=true, SERVER_VERIFIED -> USER_ACCEPTED is reported
# as a violation, because client-visible behavior needs client acceptance
# evidence first.
- from: PLANNING
  to: APPROVED_FOR_IMPLEMENTATION

- from: APPROVED_FOR_IMPLEMENTATION
  to: IMPLEMENTED

- from: IMPLEMENTED
  to: SERVER_VERIFIED

- from: SERVER_VERIFIED
  to: CLIENT_TEST_PENDING

- from: CLIENT_TEST_PENDING
  to: USER_ACCEPTED

- from: USER_ACCEPTED
  to: FROZEN

- from: SERVER_VERIFIED
  to: INVESTIGATION_REQUIRED

- from: INVESTIGATION_REQUIRED
  to: PLANNING

- from: BLOCKED_BY_CLIENT_EVIDENCE
  to: INVESTIGATION_REQUIRED

- from: FROZEN
  to: REJECTED
