# Alice 项目 skills 注册表（`.alice-supervision/skills-manifest.yml`）
#
# ⚠️ 消费者 = **DSH 侧插件 `dsh-agent-bus`（不在本仓库里）**：它在
#    `<workspacePath>/.alice-supervision/skills-manifest.yml` 读本文件，给 `required_skills` 闸门
#    判「这条 skill 是不是 maintainer-approved」（`dsh-agent-bus/lib/p0-gates.js` 是**窄解析器**，
#    只认 `- id:` / `  status:` / `  version:` 三个字段）。⚠️ 插件原话「**Absent = no gate**」
#    ⇒ **本文件不存在 = 那道闸门自动关闭**（不是报错）。
#
# ⚠️⚠️ 2026-09-28 两处更正（实测；取证在台账 `O12`）：
#   ① **原文写「consumed by the agent-bus required_skills gate」会被读成"仓库内有消费者"** ——
#      实测在 `tools/` / `.github/` / `src/` 里搜 `required_skills` / `agent-bus` 是 **0 命中**；
#      消费者在**仓库外**。⇒ ⚠️ **别按"死文件"把它删掉**（删了 = 静默关掉一道闸门）。
#   ② `D-008`（状态：稳定）已把 **agent-bus 工作流**归档 ⇒ **今天没有人在跑那道闸门**；
#      但本文件是**活的接口**：谁用 agent-bus profile 就会读它。
#
# ⚠️ 本文件**没有门禁守着**（与 `skills/*.skill.md` 不一致时 **以磁盘为准**）。它已经烂过一次：
#    更正前声明 **14** 个、磁盘 **20** 个（**3 个 id 无对应文件 · 9 个真 skill 没登记**）。
#    **加/改 skill 时记得同步这里**。想让它不再烂 = 给它一个「从 front-matter 生成 +
#    新鲜度断言」的生成器（照 `tools/capability-list.py` 先例）—— **尚未做**，登记在台账 `O12`。
#
# status 取值：draft | maintainer-approved | deprecated | revoked
#   ⚠️ 只有 `maintainer-approved` 能满足 `required_skills` 闸门；其余（含 `revoked`）一律不算。
#
# ⚠️⚠️ 2026-10-02 二次更正（`survey/51 §4.1` 当场复算；主工作流欠的账）：
#   旧文写「**下面每一条 `- id:` 都对应一个真实存在的 `skills/<id>.skill.md`**」—— **不实**：
#   实测 **3 条** `status: revoked` **没有对应文件**（`architecture-decision-framework` /
#   `evidence-collection-standard` / `test-coverage-matrix`，它们的 `summary` 自己写着「无对应 skill 文件」），
#   且 `large-refactor-survey-and-verify` **有文件却漏登记**（磁盘有 / 本文件 0 处）。
# ⭐ 现口径（分两类，⛔ 别再合成一句）：
#   · `status: revoked` 的条目 = **曾计划过、从未建文件**（⛔ 不算"存在"）；
#   · `status` 为其余值的条目 = **必须有** `skills/<id>.skill.md`。
# 核对命令（两个数必须与 `- id:` 行数对得上）：
#   ls .alice-supervision/skills/*.skill.md | wc -l                    # 磁盘真实文件数
#   grep -cE '^\s*-\s*id:' .alice-supervision/skills-manifest.yml     # 本文件声明数

