# This is an example mods.toml file. It contains the data relating to the loading mods.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 软依赖（D-316）：FTB Chunks 在场时，它的认领会被当成保护区（**只读**，我们不写回）。
# mandatory=false ⇒ 不在场照常启动；真正的适配是反射做的，构造期不加载对方任何类。
[[dependencies.${mod_id}]]
    modId="ftbchunks"
    mandatory=false
    versionRange="[2001.3.0,)"
    ordering="AFTER"
    side="BOTH"
