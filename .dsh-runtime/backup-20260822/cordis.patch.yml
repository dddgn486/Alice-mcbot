# Alice-only DSH runtime. Do not share sessions or storage with web (3081)
# or the dsh-agent-bus experiment (3082).
- id: session-persistence-jsonl
  config:
    root: /home/fb486/projects/alice/.dsh-runtime/sessions

- id: storage-json
  config:
    root: /home/fb486/projects/alice/.dsh-runtime/storages

- id: agent-bus
  config:
    maxPendingPerAgent: 4
    maxSendsPerMinute: 6
    maxMessagesPerMinute: 12
    taskTimeoutMs: 600000
    offlineGraceMs: 120000
    wakeProvider: deepseek-official
    wakeModel: deepseek-v4-flash

# Match the verified 3081 launch path. Do not launch the packaged helper from
# the WSL UNC filesystem: it can stall before its READY handshake.
- id: dsh-dafeiyu
  config:
    enabled: true
    scale: 1
    bubbleScale: 1
    activityLevel: normal
    reducedMotion: false
    bubbleMode: always
    bubbleStates:
      - SUCCESS
      - ERROR
      - WAITING
    includeSubagents: false
    webuiUrl: http://127.0.0.1:3083/
    helper:
      command: /mnt/c/Windows/System32/cmd.exe
      args:
        - /d
        - /c
        - C:\Users\dddgn\AppData\Local\DSH\dsh-dafeiyu\dsh-dafeiyu-helper.exe
